name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build GitHub APK and check the Play build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleGithubRelease assemblePlayRelease

      # Google Play forbids self-updating apps, so the Play build must not ask to install packages.
      - name: Check Play build permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          "$AAPT" dump permissions app/build/outputs/apk/play/release/app-play-release.apk | tee perms.txt
          if grep -q "REQUEST_INSTALL_PACKAGES" perms.txt; then
            echo "::error::The Play build must not request permission to install packages"; exit 1
          fi
          # Without ads the app leaves AdMob out, so neither build may ask for the advertising ID.
          "$AAPT" dump permissions app/build/outputs/apk/github/release/app-github-release.apk >> perms.txt
          if ! grep -q "^adsEnabled=true" gradle.properties && grep -q "AD_ID" perms.txt; then
            echo "::error::The app has no ads, so it must not request the advertising ID"; exit 1
          fi

      # Google Play bundle: only when the upload key secrets exist (see PUBLICAR_EN_GOOGLE_PLAY.md).
      - name: Restore Google Play upload key
        id: upload_key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Google Play upload key yet; skipping the Play bundle."
          fi

      - name: Build Google Play bundle
        if: steps.upload_key.outputs.present == 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon bundlePlayRelease

      - name: Keep Google Play bundle
        if: steps.upload_key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SignosDaily-play-1.0.${{ github.run_number }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab

      # Sends the bundle to the closed testing track once the service account secret exists.
      - name: Check Google Play service account
        id: play_account
        if: steps.upload_key.outputs.present == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Google Play service account yet; upload the bundle by hand."
          fi

      - name: Upload to Google Play closed testing
        if: steps.play_account.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.andoni.signosdaily
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: alpha
          status: completed

      - name: Rename APK and write notes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk SignosDaily.apk
          printf '%s\n' "${COMMIT_MESSAGE:-Nueva versión}" | head -n 1 > notes.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Signos Daily 1.0.${{ github.run_number }}
          body_path: notes.txt
          files: SignosDaily.apk
          make_latest: true
