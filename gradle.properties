org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AdMob (only used by the play flavor; the github flavor always uses Google test IDs).
# Fill in when the app exists in AdMob; until then the Play build falls back to test IDs.
admobAppId=
admobBannerId=

# The sign videos come from DILSE (Fundación CNSE, CC BY-NC-SA 3.0: no commercial use).
# Keep real ads off in the Play build until the Fundación CNSE gives written permission.
playAdsEnabled=false
