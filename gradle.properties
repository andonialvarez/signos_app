org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AdMob (only used by the play flavor; the github flavor always uses Google test IDs).
# Fill in when the app exists in AdMob; until then the Play build falls back to test IDs.
admobAppId=
admobBannerId=

# The sign videos come from DILSE (Fundación CNSE, CC BY-NC-SA 3.0: no commercial use), so the app
# has no ads, and does not even include the AdMob SDK, until the Fundación CNSE gives written
# permission. With adsEnabled=true the GitHub build shows test ads and the Play build real ones.
adsEnabled=false
